name: poc-ci

on:
  push:
    paths: ["poc/**", ".github/workflows/poc-ci.yml"]
  pull_request:
    paths: ["poc/**", ".github/workflows/poc-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: poc-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: poc/transferencias-poc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Unitarias (surefire) + integracion con Testcontainers (failsafe). Docker viene en ubuntu-latest.
      - name: Build y pruebas
        run: |
          chmod +x mvnw   # el repo se versiona desde Windows; asegura el bit de ejecucion
          ./mvnw -B -ntp verify

      - name: Publicar reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas
          path: |
            poc/transferencias-poc/target/surefire-reports/
            poc/transferencias-poc/target/failsafe-reports/
          if-no-files-found: ignore

      - name: Validar docker compose
        working-directory: poc
        run: docker compose config -q

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
