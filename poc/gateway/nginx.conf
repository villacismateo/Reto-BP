# Gateway/BFF minimo de la PoC (sustituye a Amazon API Gateway + BFF del diseno objetivo).
# Demuestra: punto unico de entrada, rate limiting por IP, correlation id, limite de tamano y
# ocultamiento de endpoints internos. NO valida tokens OAuth 2.0 (fuera de alcance de la PoC).
worker_processes auto;
events { worker_connections 1024; }

http {
  server_tokens off;
  limit_req_zone $binary_remote_addr zone=por_ip:10m rate=20r/s;
  log_format json escape=json '{"ts":"$time_iso8601","req_id":"$request_id","ip":"$remote_addr",'
                              '"metodo":"$request_method","uri":"$uri","estado":$status,"ms":$request_time}';
  access_log /dev/stdout json;

  upstream transferencias {
    server app:8080;
    keepalive 16;
  }

  server {
    listen 8080;
    client_max_body_size 16k;

    # Correlation id: se propaga al servicio y se devuelve al cliente
    set $correlacion $http_x_request_id;
    if ($correlacion = "") { set $correlacion $request_id; }
    add_header X-Request-Id $correlacion always;

    location /api/v1/ {
      limit_req zone=por_ip burst=40 nodelay;
      limit_req_status 429;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header X-Request-Id $correlacion;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 1s;
      proxy_read_timeout 5s;
      proxy_pass http://transferencias;
    }

    # Solo salud publica; el resto de actuator queda interno
    location = /salud { proxy_pass http://transferencias/actuator/health; }
    location /actuator { return 404; }
    location / { return 404; }
  }
}
